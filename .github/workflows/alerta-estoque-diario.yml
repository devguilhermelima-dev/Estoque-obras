    - cron: '0 12 * * *'   # todo dia às 12:00 UTC (9h em Brasília)
  workflow_dispatch:         # também pode ser disparado manualmente pela aba Actions

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar estoque minimo e enviar e-mails
        run: |
          curl -s -X POST \
            "https://rnfyancftrwxfehfxaur.supabase.co/functions/v1/alerta-estoque-minimo" \
            -H "apikey: sb_publishable_06XgkXtUdsqKTsDn8skzqg_GFTxgxVT" \
            -H "Authorization: Bearer sb_publishable_06XgkXtUdsqKTsDn8skzqg_GFTxgxVT" \
            -H "Content-Type: application/json"
